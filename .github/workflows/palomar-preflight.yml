# Predictive Palomar mechanical preflight (advisory, not a registry submission).
# Reusable workflow from PalomarRegistry/PalomarSubmission, pinned to a full commit; keep
# `pipeline_commit` equal to the `uses` SHA. See notes/palomar.md.
name: Palomar preflight
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      # On pull requests, check the PR head commit (github.sha is GitHub's merge commit there).
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
