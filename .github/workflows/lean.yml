# Clean build on GitHub: PGAL only merges a lean-research PR when this is green
# (pgal/docs/lean-research.md). Mathlib comes from its prebuilt cache, never compiled here.
name: Lean
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: "Check Lean source requirements (Palomar: module header, line limits)"
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6  # v1.6.2
      # Research modules outside the default targets (notes/build-times.md): checked here explicitly.
      - name: Build non-default research modules
        run: lake build ErdosResearchExtra
