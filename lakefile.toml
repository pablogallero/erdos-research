name = "ErdosResearch"
defaultTargets = ["ErdosResearch", "Challenge", "Solution"]

# Lean v4.35.0 and the matching Mathlib tag (Palomar requires >= v4.35.0-rc2).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "ErdosResearch"

# Palomar package: statements only (Mathlib imports only).
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# Palomar package: proofs of the Challenge statements, with the same names and types.
[[lean_lib]]
name = "Solution"
roots = ["Solution"]
